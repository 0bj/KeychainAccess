name: Test
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  spm:
    name: SwiftPM build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  build:
    name: Build (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            destination: generic/platform=watchOS Simulator
          - name: macOS
            destination: platform=macOS
          - name: Mac Catalyst
            destination: platform=macOS,variant=Mac Catalyst
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace KeychainAccess.xcworkspace \
            -scheme KeychainAccess \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO

  build-tests:
    # Running keychain tests requires a signed test host (see README), so CI only compiles them.
    name: Build tests (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace KeychainAccess.xcworkspace \
            -scheme KeychainAccessTests \
            -destination '${{ matrix.destination }}'
